[project]
name = "ai-core"
version = "0.1.0"
description = "Python MCP Server + Codebase Intelligence Engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "watchdog>=4.0.0",
  "networkx>=3.3",
  "lancedb>=0.12.0",
  "pyarrow>=16.0.0",
  "numpy>=1.26.0",
  "tree-sitter>=0.22.0",
  "tree-sitter-language-pack>=0.7.0",
  "mcp>=1.0.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]
reranker = ["sentence-transformers>=3.0.0"]

[tool.setuptools.packages.find]
include = ["intelligence_engine*", "mcp_server*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
