services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ai-core

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    networks:
      - ai-core
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mcp-server:
    build:
      context: ./mcp-server
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      ENGINE_HOST: http://intelligence-engine:8000
    volumes:
      - ./projects:/workspace/projects
    depends_on:
      intelligence-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ai-core

  intelligence-engine:
    build:
      context: ./intelligence-engine
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./projects:/workspace/projects
      - ./intelligence-engine/data:/app/data
      - ./intelligence-engine/src:/app/src
      - ./projects.json:/app/projects.json
    depends_on:
      redis:
        condition: service_started
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - ai-core

  intelligence-worker:
    build:
      context: ./intelligence-engine
    command: ["python", "-m", "src.tasks.worker"]
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./projects:/workspace/projects
      - ./intelligence-engine/data:/app/data
      - ./intelligence-engine/src:/app/src
      - ./projects.json:/app/projects.json
    depends_on:
      redis:
        condition: service_started
      intelligence-engine:
        condition: service_healthy
    networks:
      - ai-core

networks:
  ai-core:
    driver: bridge
